<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 880 300" width="880" height="300" role="img" aria-label="What happens when Control-right-bracket is pressed">
  <style>
    .card { fill: #fbfbfa; stroke: #d8d4cd; stroke-width: 1; }
    .box  { fill: #ffffff; stroke: #e4e0d9; stroke-width: 1; }
    .h    { font: 600 19px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .sub  { font: 400 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #6a6259; }
    .lbl  { font: 600 13px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .det  { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #857c71; }
    .key  { font: 600 17px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #1f2328; }
    .out  { font: 600 14px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; fill: #2f7d4f; }
    .gate { font: 400 11.5px -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; fill: #9a6b2f; }
  </style>

  <rect x="0.5" y="0.5" width="879" height="299" rx="10" class="card"/>
  <text x="32" y="44" class="h">What happens when you press ⌃]</text>
  <text x="32" y="68" class="sub">Each link is separately checkable — see the diagnostics in this document.</text>

  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0 0 L10 5 L0 10 z" fill="#bdb6ab"/>
    </marker>
  </defs>

  <!-- 1 -->
  <rect x="32" y="104" width="140" height="66" rx="7" class="box"/>
  <text x="102" y="133" class="key" text-anchor="middle">⌃]</text>
  <text x="102" y="153" class="det" text-anchor="middle">keypress</text>

  <line x1="176" y1="137" x2="204" y2="137" stroke="#bdb6ab" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 2 -->
  <rect x="208" y="104" width="164" height="66" rx="7" class="box"/>
  <text x="290" y="130" class="lbl" text-anchor="middle">Hammerspoon</text>
  <text x="290" y="150" class="det" text-anchor="middle">modal hotkey</text>
  <text x="290" y="196" class="gate" text-anchor="middle">active only while</text>
  <text x="290" y="212" class="gate" text-anchor="middle">Illustrator is frontmost</text>
  <path d="M290 176 l0 -6" stroke="#d8bf8f" stroke-width="1.5"/>

  <line x1="376" y1="137" x2="404" y2="137" stroke="#bdb6ab" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 3 -->
  <rect x="408" y="104" width="164" height="66" rx="7" class="box"/>
  <text x="490" y="130" class="lbl" text-anchor="middle">Accessibility API</text>
  <text x="490" y="150" class="det" text-anchor="middle">selectMenuItem</text>
  <text x="490" y="196" class="gate" text-anchor="middle">needs the Accessibility</text>
  <text x="490" y="212" class="gate" text-anchor="middle">grant, read at launch</text>
  <path d="M490 176 l0 -6" stroke="#d8bf8f" stroke-width="1.5"/>

  <line x1="576" y1="137" x2="604" y2="137" stroke="#bdb6ab" stroke-width="1.5" marker-end="url(#a)"/>

  <!-- 4 -->
  <rect x="608" y="104" width="240" height="66" rx="7" class="box"/>
  <text x="728" y="130" class="lbl" text-anchor="middle">File ▸ Scripts ▸ Stroke Weight Up</text>
  <text x="728" y="150" class="det" text-anchor="middle">the .jsx in Illustrator's Scripts folder</text>

  <!-- outcome -->
  <line x1="728" y1="176" x2="728" y2="240" stroke="#bdb6ab" stroke-width="1.5" marker-end="url(#a)"/>
  <rect x="560" y="244" width="288" height="38" rx="7" fill="#f1f8f3" stroke="#bcd9c8"/>
  <text x="704" y="268" class="out" text-anchor="middle">strokeWidth  1pt → 1.5pt</text>
</svg>
